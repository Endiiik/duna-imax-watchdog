name: Duna 3 IMAX watchdog

# Hlídá rozpis Cinema City Flora. Když přibude promítání Duny: část třetí
# v IMAXu, zmizí, nebo se u něj uvolní místa, založí issue (GitHub z něj pošle
# e-mail i push do mobilní appky).
#
# GitHub cron u malých repozitářů spolehlivě neběží (za 17 h proběhly 3 běhy
# místo ~68). Proto jeden běh udělá 5 kontrol po 10 minutách (~45 min) a na
# konci si sám spustí další běh. Cron je jen záloha pro obnovení řetězu.
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      force_report:
        description: "Nahlásit všechny aktuální termíny i s volnými místy"
        type: boolean
        default: false

# Vždy běží jen jeden řetěz. Nový běh čeká, než doběhne předchozí; z čekajících
# zůstane jen jeden, takže se záložní cron s řetězem sloučí.
concurrency:
  group: watchdog
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write   # aby si běh mohl spustit další

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Kontroly rozpisu
        env:
          GH_TOKEN: ${{ github.token }}
          # Řádky "slug:podřetězec názvu filmu". API vrací české názvy.
          # Když změníš existující řádek, smaž i jeho state/<slug>.json.
          FILMS: |
            duna3:část třetí
          AUDITORIUM_PATTERN: imax
          # Od kolika nově uvolněných míst u jednoho promítání hlásit.
          MIN_SEAT_DELTA: "4"
          CHECKS: "5"
          INTERVAL: "600"
          FORCE_REPORT: ${{ inputs.force_report && 'true' || 'false' }}
        run: bash run_checks.sh

      - name: Spustit další běh
        # Jen na hlavní větvi; řetěz zastavíš přes Actions → Disable workflow.
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5; do
            gh workflow run watch.yml --ref main && exit 0
            sleep $((i * 15))
          done
          echo "::warning::Další běh se nepodařilo spustit, obnoví ho záložní cron."
