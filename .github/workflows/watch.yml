name: Duna 3 IMAX watchdog

# Každých ~15 minut zkontroluje rozpis Cinema City Flora. Když přibude
# promítání Duny: část třetí v IMAXu, nebo se u existujícího uvolní místa,
# založí issue (GitHub z něj pošle e-mail i push do mobilní appky).
#
# Naplánováno 4× za hodinu: GitHub u scheduled workflows běhy pod zátěží
# občas zahazuje. Minuty schválně mimo :00 a :30, ať netrefí špičku.
on:
  schedule:
    - cron: "8,38 * * * *"
    - cron: "21,51 * * * *"
  workflow_dispatch:
    inputs:
      force_report:
        description: "Nahlásit všechny aktuální termíny i s volnými místy"
        type: boolean
        default: false

# Stav se commituje zpátky do repa — souběžné běhy by si přepsaly commit.
concurrency:
  group: watchdog
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Zkontrolovat rozpis
        # Řádky "slug:podřetězec názvu filmu". API vrací české názvy.
        # Když změníš existující řádek, smaž i jeho state/<slug>.json.
        env:
          FILMS: |
            duna3:část třetí
          AUDITORIUM_PATTERN: imax
          # Od kolika nově uvolněných míst u jednoho promítání hlásit.
          MIN_SEAT_DELTA: "4"
        run: |
          set -euo pipefail
          while IFS=: read -r slug pattern; do
            [ -n "$slug" ] || continue
            echo "::group::$slug (film ~ $pattern)"
            FILM_PATTERN="$pattern" python3 watch.py \
              --state "state/$slug.json" \
              --report "report-$slug.md" \
              --title "title-$slug.txt" \
              ${{ inputs.force_report && '--force-report' || '' }}
            echo "::endgroup::"
          done <<< "$FILMS"

      - name: Založit issue s novinkami
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Přiřazení vlastníkovi je klíčové: e-mail chodí defaultně jen
          # u "Participating" notifikací (přiřazení, zmínky).
          shopt -s nullglob
          for report in report-*.md; do
            slug=${report#report-}; slug=${slug%.md}
            url=$(gh issue create \
              --title "$(cat "title-$slug.txt")" \
              --body-file "$report" \
              --assignee "${{ github.repository_owner }}")
            echo "Založeno ($slug): $url"
            # Issue je jen doručovací kanál — notifikace odejde při založení.
            gh issue close "$url" --reason completed
          done

      - name: Uložit stav zpátky do repa
        run: |
          rm -f report-*.md title-*.txt
          if [ -z "$(git status --porcelain -- state/)" ]; then
            echo "Stav beze změny, není co commitovat."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git commit -m "Aktualizace stavu rozpisu ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          for i in 1 2 3; do
            git pull --rebase --quiet origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          echo "::error::Push stavu se nepovedl."
          exit 1
